# Always-on Chromium for the AI Usage Bridge.
# Works as a Portainer stack (Stacks → Add stack → Web editor) or with `docker compose up -d`.
# No host folders or console needed: the bridge extension is synced into a Docker volume hourly.
# Before deploying: replace CHANGE-ME on the PASSWORD line with your own password.
# Open https://<docker-host-ip>:3001 to see the browser. LAN only: never port-forward it.
services:
  # Keeps the AI Usage Bridge extension up to date: downloads it now and every hour.
  # The extension reloads itself when a new version lands.
  bridge-sync:
    image: alpine/git:latest
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          rm -rf /tmp/r
          if git clone -q --depth 1 https://github.com/darionb85/home-dashboard /tmp/r; then
            cp -r /tmp/r/bridge/. /out/ && echo "bridge synced: $$(grep '"version"' /out/manifest.json)"
          else
            echo "bridge sync failed (will retry in 1h)"
          fi
          sleep 3600
        done
    volumes:
      - bridge:/out
    healthcheck:
      test: ["CMD", "test", "-f", "/out/manifest.json"]
      interval: 10s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  chromium:
    image: lscr.io/linuxserver/chromium:latest
    container_name: ai-usage-browser
    depends_on:
      bridge-sync:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - CUSTOM_USER=dashboard
      - PASSWORD=CHANGE-ME          # ← replace CHANGE-ME with your own password before deploying
      - CHROME_CLI=--load-extension=/bridge chrome://extensions
    volumes:
      - chromium-config:/config      # browser profile = your logins; stays on this host
      - bridge:/bridge:ro
    ports:
      - 3001:3001                    # HTTPS desktop (self-signed cert)
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  bridge:
  chromium-config:
