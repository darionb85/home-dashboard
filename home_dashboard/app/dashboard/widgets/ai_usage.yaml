requires: [ai_usage]
cards:
  # One card per AI: current/session + weekly gauges and resets (custom:ai-usage-card,
  # installed by the add-on). Hidden until that AI has a number.
  - _repeat: {over: ai_usage, as: ai}
    _requires: [ai_card]
    type: conditional
    conditions:
      - condition: numeric_state
        entity: "{{ai}}"
        above: -1
    card:
      type: custom:ai-usage-card
      entity: "{{ai}}"
  # Fallback if the card couldn't be installed yet: built-in gauges.
  - _repeat: {over: ai_usage, as: ai}
    _unless: [ai_card]
    type: conditional
    conditions:
      - condition: numeric_state
        entity: "{{ai}}"
        above: -1
    card:
      type: gauge
      entity: "{{ai}}"
      min: 0
      max: 100
      needle: false
      severity: {green: 0, yellow: 60, red: 85}
  - _requires: [addon_ingress]
    type: button
    name: Refresh / edit AI usage
    icon: mdi:refresh
    show_state: false
    tap_action:
      action: navigate
      navigation_path: "{{addon_ingress}}"
